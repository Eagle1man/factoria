name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings asyncua \
            sqlalchemy aiosqlite alembic PyJWT PyYAML pytest httpx websockets pytest-cov ruff

      - name: Линтер
        run: ruff check backend tests scripts

      - name: Тесты с покрытием
        env:
          ENV: test
          DATABASE_URL: sqlite+aiosqlite:///./data/ci.db
          OPCUA_ENABLED: "false"
          JWT_SECRET: ci-secret-at-least-32-bytes-long!!
          PYTHONPATH: backend/src
        run: |
          mkdir -p data
          python -m pytest -q --cov=factoria --cov-report=term-missing

      - name: Миграции на чистой базе
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/migrations.db
        run: |
          mkdir -p data
          cd backend
          mkdir -p data
          alembic upgrade head
          alembic current

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        run: npm ci --no-audit --no-fund

      - name: Сборка и типы
        run: npm run build

  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости для проверки дизайн-системы
        run: pip install pytest pyyaml

      - name: Дизайн-система
        run: python -m pytest tests/test_design_md.py -q

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Зависимости
        run: |
          pip install fastapi uvicorn pydantic pydantic-settings asyncua \
            sqlalchemy aiosqlite alembic PyJWT PyYAML httpx playwright
          python -m playwright install --with-deps chromium
          npm ci --prefix frontend --no-audit --no-fund

      - name: Поднять контур
        env:
          PYTHONPATH: backend/src
          ENV: dev
          DATABASE_URL: sqlite+aiosqlite:///./data/visual.db
          OPCUA_ENDPOINT: opc.tcp://127.0.0.1:48400
        run: |
          mkdir -p data
          python opcua-emulator/emulator.py --seconds 600 > emulator.log 2>&1 &
          python -m uvicorn factoria.main:app --port 8010 --log-level warning > backend.log 2>&1 &
          npm --prefix frontend run dev -- --host 127.0.0.1 --port 5173 > vite.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8010/api/v1/health > /dev/null && break; sleep 1; done
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5173 > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8010/api/v1/health | head -c 200

      - name: Скриншоты и проверка переполнения
        env:
          PYTHONPATH: backend/src
        run: python scripts/shots.py

      - name: Артефакт со скриншотами
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/assessment/checks/shots/
          retention-days: 14

      - name: Логи сервисов при падении
        if: failure()
        run: |
          tail -50 backend.log || true
          tail -50 vite.log || true
          tail -50 emulator.log || true
