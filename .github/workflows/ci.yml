name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings asyncua \
            sqlalchemy aiosqlite alembic PyJWT PyYAML pytest httpx websockets pytest-cov ruff

      - name: Линтер
        run: ruff check backend tests scripts

      - name: Тесты с покрытием
        env:
          ENV: test
          DATABASE_URL: sqlite+aiosqlite:///./data/ci.db
          OPCUA_ENABLED: "false"
          JWT_SECRET: ci-secret-at-least-32-bytes-long!!
          PYTHONPATH: backend/src
        run: |
          mkdir -p data
          python -m pytest -q --cov=factoria --cov-report=term-missing

      - name: Миграции на чистой базе
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/migrations.db
        run: |
          mkdir -p data
          cd backend
          mkdir -p data
          alembic upgrade head
          alembic current

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        run: npm ci --no-audit --no-fund

      - name: Сборка и типы
        run: npm run build

  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости для проверки дизайн-системы
        run: pip install pytest pyyaml

      - name: Дизайн-система
        run: python -m pytest tests/test_design_md.py -q
