[project]
name = "factoria-backend"
version = "0.2.0"
description = "FACTORIA & AI — backend (FastAPI, OPC UA, SQLite)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "asyncua>=2.0",
    "SQLAlchemy>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "PyJWT>=2.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "websockets>=12"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
